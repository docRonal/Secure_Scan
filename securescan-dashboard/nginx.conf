server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: неизвестные пути отдаём на index.html, чтобы
    # клиентский роутер (если появится) сам разобрался с путём.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статику с хэшами в имени можно кэшировать агрессивно.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
